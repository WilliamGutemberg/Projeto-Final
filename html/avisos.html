<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisos e acessibilidade - Saúde Sem Filas</title>
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div id="header">
        <a href="inicio.html">Voltar</a>
        <h1>Avisos </h1>
    </div>

    <form action="inicio.html" method="get">

        <div id="lembretesconsulta">
            <h2>Lembretes de consulta</h2>
            <label><input type="checkbox" name="um-dia-antes" checked> 1 dia antes (aviso na véspera da
                consulta)</label>
            <label><input type="checkbox" name="duas-horas-antes" checked> 2 horas antes (aviso para você sair com
                calma)</label>
        </div>

        <div id="lembretesfila">
            <h2>Durante a fila</h2>
            <label><input type="checkbox" name="faltam-duas" checked> Quando faltarem 2 pessoas (hora de ir para a
                recepção)</label>
            <label><input type="checkbox" name="minha-vez" checked> Quando for a minha vez (aviso com o
                consultório)</label>
        </div>

        <div id="avisar">
            <h2>Como avisar</h2>
            <label><input type="checkbox" name="notificacao" checked> Notificação no celular</label>
            <label><input type="checkbox" name="whatsapp" checked> WhatsApp</label>
            <label><input type="checkbox" name="sms" checked> SMS</label>
        </div>

        <div id="botao"><br>
            <button type="submit">Salvar e voltar ao início</button>
        </div>

    </form>

</body>

</html>
