<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Saúde Sem Filas</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div id="header">
        <h1>Entrar na sua Conta</h1>
    </div>
    <div id="main">
        <P>Preencha seus dados.
            Campos com * são obrigatorios.
        </P>
        <form action="inicio.html" method="get">

            <div id="campo-email">
                <label for="email">E-mail </label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <br>

            <div id="campo-senha">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password" minlength="8" required>
            </div>
            <br>
            <div id="esqueci">
                <a href="recuperar.html">Esqueci minha senha.</a>
            </div>

            <br>

            <div id="botao">
                <button type="submit">Entrar</button>
            </div>
        </form>
        <div id="criar"><br>
            <a href="cadastro.html">Criar uma conta.</a>
        </div>
        <div id="funcionario"><br>
            <a href="entrar_funcionario.html">Sou funcionario</a>
        </div>


    </div>


</body>

</html>
